[package]
name = "camo-translator"
default-run = "camo-translator"
version = "0.2.2"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wt-formats = "0.1.1"
wt-unpack = "0.5.1"
csv = "1.4"

[dev-dependencies]
fbxcel = { version = "0.9", features = ["tree", "writer"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu"] }
rfd = { version = "0.16.0", default-features = false }
wgpu = { version = "27.0.1", default-features = false, features = ["dx12"] }
